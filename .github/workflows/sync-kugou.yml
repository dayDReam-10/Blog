name: Sync KuGou recent songs

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-kugou-recent-songs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      KUGOU_API_COMMIT: 5d6c9f7b180279c9dd08bc6f7159de52a856d587
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download pinned KuGou API
        run: |
          curl --fail --silent --show-error --location \
            "https://codeload.github.com/MakcRe/KuGouMusicApi/zip/$KUGOU_API_COMMIT" \
            --output "$RUNNER_TEMP/kugou-api.zip"
          unzip -q "$RUNNER_TEMP/kugou-api.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/KuGouMusicApi-$KUGOU_API_COMMIT" "$RUNNER_TEMP/KuGouMusicApi"
          npm ci --omit=dev --prefix "$RUNNER_TEMP/KuGouMusicApi"

      - name: Generate public song list
        env:
          KUGOU_AUTH_JSON: ${{ secrets.KUGOU_AUTH_JSON }}
          KUGOU_API_DIR: ${{ runner.temp }}/KuGouMusicApi
        run: node scripts/sync-kugou-static.js

      - name: Commit updated songs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/recent-songs.json
          if git diff --cached --quiet; then
            echo "Recent songs are unchanged."
            exit 0
          fi
          git commit -m "Update recent KuGou songs"
          git pull --rebase origin main
          git push origin HEAD:main
