<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayDReam | Article</title>
    <link rel="icon" href="./assets/cy.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Fira+Code:wght@400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0d1117; --text:#e6edf3; --main-text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent-color:#58a6ff; --glass:rgba(22,27,34,.74); --border:rgba(255,255,255,.1); --glass-border:rgba(255,255,255,.1); --toggle-bg:rgba(255,255,255,.05); --overlay:rgba(13,17,23,.62); --particle:rgba(88,166,255,.1); }
        [data-theme="light"] { --bg:#f6f8fa; --text:#1f2328; --main-text:#1f2328; --muted:#636c76; --accent:#0969da; --accent-color:#0969da; --glass:rgba(255,255,255,.78); --border:rgba(31,35,40,.12); --glass-border:rgba(31,35,40,.1); --toggle-bg:rgba(0,0,0,.05); --overlay:rgba(255,255,255,.36); --particle:rgba(0,0,0,.05); }
        * { box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { margin:0; min-height:100vh; overflow-x:hidden; background:var(--bg); color:var(--text); font:16px/1.8 Inter,'Noto Serif SC',sans-serif; -webkit-font-smoothing:antialiased; }
        #bg-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; opacity:.8; pointer-events:none; }
        .site-banner { position:relative; height:58vh; display:flex; justify-content:center; align-items:center; overflow:hidden; clip-path:polygon(0 0,100% 0,100% 85%,0 100%); }
        #bg-image { position:absolute; inset:0; background:linear-gradient(var(--overlay),var(--bg)),url('./assets/dbp.jpg') center/cover no-repeat; transform:scale(1.3); transition:transform .3s ease-out,background .5s ease; z-index:-1; }
        .banner-content { position:relative; z-index:1; min-height:8rem; width:100%; }
        nav { position:fixed; top:0; width:100%; height:100px; display:flex; justify-content:space-between; align-items:center; padding:0 8%; z-index:1000; }
        .nav-left { display:flex; align-items:center; gap:25px; }
        .view-projects-btn { color:var(--main-text); text-decoration:none; font-size:.85rem; font-weight:700; letter-spacing:2px; padding:8px 16px; position:relative; transition:all .3s ease; display:inline-block; font-family:'Fira Code','Courier New',monospace; }
        .view-projects-btn::before,.view-projects-btn::after { content:''; position:absolute; width:10px; height:10px; border:1px solid transparent; transition:all .3s ease-out; }
        .view-projects-btn::before { top:0; left:-5px; border-top-color:#fff; border-left-color:#fff; }
        .view-projects-btn::after { bottom:0; right:-5px; border-bottom-color:#fff; border-right-color:#fff; }
        .view-projects-btn:hover { color:#fff; letter-spacing:4px; text-shadow:0 0 8px rgba(255,255,255,.5); }
        .view-projects-btn:hover::before,.view-projects-btn:hover::after { width:calc(100% + 10px); height:100%; border-color:#fff; }
        .theme-switch-wrapper { display:flex; align-items:center; cursor:pointer; padding:4px; background:var(--toggle-bg); border:1px solid var(--glass-border); border-radius:20px; width:58px; height:30px; position:relative; }
        .theme-switch-thumb { width:22px; height:22px; background:var(--accent-color); border-radius:50%; position:absolute; left:4px; transition:transform .4s cubic-bezier(.68,-.55,.265,1.55); display:flex; align-items:center; justify-content:center; }
        .theme-switch-thumb svg { width:14px; height:14px; fill:white; }
        [data-theme="light"] .theme-switch-thumb { transform:translateX(28px); }
        main { position:relative; z-index:1; width:min(940px,calc(100% - 2rem)); margin:-6rem auto 5rem; }
        .article-shell { background:var(--glass); backdrop-filter:blur(18px); border:1px solid var(--border); box-shadow:0 20px 50px rgba(0,0,0,.28); padding:clamp(1.3rem,4vw,3.5rem); }
        .article-meta { display:flex; flex-wrap:wrap; align-items:center; gap:.8rem 1.2rem; padding-bottom:1.2rem; border-bottom:1px solid var(--border); color:var(--muted); font:500 .75rem 'Fira Code',monospace; letter-spacing:1px; }
        .status { color:var(--accent); }
        h2 { margin:1.5rem 0 .3rem; color:var(--accent); font-size:clamp(1.8rem,4vw,3rem); line-height:1.25; }
        .article-content { margin-top:2rem; font-family:Inter,'Noto Serif SC',sans-serif; font-size:1.04rem; }
        .article-content h1,.article-content h2,.article-content h3,.article-content h4 { color:var(--text); margin:2.2rem 0 .8rem; line-height:1.35; }
        .article-content p,.article-content ul,.article-content ol,.article-content blockquote,.article-content pre { margin:1rem 0; }
        .article-content ul,.article-content ol { padding-left:1.5rem; }
        .article-content blockquote { border-left:3px solid var(--accent); background:rgba(88,166,255,.07); padding:.7rem 1rem; color:var(--muted); }
        .article-content code { color:var(--accent); background:rgba(88,166,255,.12); padding:.12rem .35rem; border-radius:4px; font:500 .9em 'Fira Code',monospace; }
        .article-content pre { overflow:auto; padding:1rem; background:rgba(0,0,0,.28); border:1px solid var(--border); border-radius:6px; }
        .article-content pre code { color:var(--text); background:none; padding:0; }
        .article-content a { color:var(--accent); text-underline-offset:3px; }
        .end-marker { margin-top:3rem; color:var(--accent); font:500 .8rem 'Fira Code',monospace; letter-spacing:2px; }
        .error { color:#ff7b72; font-family:'Fira Code',monospace; }
        @media (max-width:600px) { nav { height:80px; padding:0 6%; } .site-banner { height:48vh; } main { width:min(100% - 1rem,940px); margin-top:-4rem; } .article-shell { padding:1rem; } .article-content { font-size:1rem; } }
    </style>
</head>

<body data-theme="dark">
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <nav>
        <div class="nav-left" style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html" class="view-projects-btn">HOME</a>
        </div>
        <div class="theme-switch-wrapper" id="theme-toggle" role="button" tabindex="0" aria-label="切换日夜模式">
            <div class="theme-switch-thumb">
                <svg class="icon-sun" viewBox="0 0 24 24" style="display:none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="5" fill="#FFD600" />
                    <g stroke="#FFD600" stroke-width="2">
                        <line x1="12" y1="2" x2="12" y2="5" /><line x1="12" y1="19" x2="12" y2="22" />
                        <line x1="2" y1="12" x2="5" y2="12" /><line x1="19" y1="12" x2="22" y2="12" />
                        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" /><line x1="17.66" y1="17.66" x2="19.78" y2="19.78" />
                        <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" /><line x1="17.66" y1="6.34" x2="19.78" y2="4.22" />
                    </g>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" style="display:block" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15.5A9 9 0 1 1 12 3a7 7 0 0 0 9 12.5z" fill="#fff" />
                    <circle cx="17.5" cy="7.5" r="1.2" fill="#58a6ff" /><circle cx="15.2" cy="5.8" r=".5" fill="#58a6ff" /><circle cx="19" cy="10" r=".6" fill="#58a6ff" />
                </svg>
            </div>
        </div>
    </nav>
    <header class="site-banner">
        <div id="bg-image"></div>
        <div class="banner-content"></div>
    </header>
    <main>
        <article class="article-shell" id="article-shell">
            <div class="article-meta"><span id="article-date">LOADING_RECORD...</span><span class="status" id="article-status"></span></div>
            <h2 id="article-title">Loading...</h2>
            <div class="article-content" id="article-content"></div>
            <div class="end-marker">[ END OF RECORD ]</div>
        </article>
    </main>
    <script src="notes_data.js"></script>
    <script type="module">
        import { marked } from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js';
        marked.setOptions({ gfm:true, breaks:true });
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const records = typeof notesData !== 'undefined' ? notesData : [];
        const note = Array.isArray(records) ? records.find((item) => item.idDate === id) : null;
        const normalize = (content = '') => String(content).replace(/\r\n/g,'\n').replace(/<br\s*\/?>(\s*)/gi,'\n').replace(/^\s*---\s*\n?/,'').trim();
        if (!note) {
            document.getElementById('article-title').textContent = 'RECORD_NOT_FOUND';
            document.getElementById('article-content').innerHTML = '<p class="error">The requested article does not exist in notes_data.js.</p>';
        } else {
            document.title = `${note.title} | DayDReam`;
            document.getElementById('article-date').textContent = `LOG: ${note.datetime}`;
            document.getElementById('article-status').textContent = note.status;
            document.getElementById('article-title').textContent = note.title;
            document.getElementById('article-content').innerHTML = marked.parse(normalize(note.content));
            const firstHeading = document.querySelector('#article-content h1, #article-content h2');
            if (firstHeading && firstHeading.textContent.trim() === note.title.trim()) firstHeading.remove();
        }
        const body = document.body;
        const toggle = document.getElementById('theme-toggle');
        const sunIcon = toggle.querySelector('.icon-sun');
        const moonIcon = toggle.querySelector('.icon-moon');
        function updateThemeIcon() {
            const isDark = body.dataset.theme === 'dark';
            sunIcon.style.display = isDark ? 'none' : 'block';
            moonIcon.style.display = isDark ? 'block' : 'none';
        }
        function switchTheme() {
            body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
            updateThemeIcon();
        }
        toggle.addEventListener('click', switchTheme);
        toggle.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); switchTheme(); }
        });
        updateThemeIcon();
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        function resize() { canvas.width = innerWidth; canvas.height = innerHeight; points = Array.from({ length:40 }, () => ({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5 })); }
        function draw() { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--particle').trim(); points.forEach((p,i) => { p.x += p.vx; p.y += p.vy; if (p.x<0 || p.x>canvas.width) p.vx *= -1; if (p.y<0 || p.y>canvas.height) p.vy *= -1; points.slice(i+1).forEach((q) => { if (Math.hypot(p.x-q.x,p.y-q.y)<180) { ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); } }); }); requestAnimationFrame(draw); }
        resize(); draw(); addEventListener('resize', resize);
        const bgImg = document.getElementById('bg-image');
        addEventListener('mousemove', (event) => {
            const x = (event.clientX / innerWidth - 0.5) * 60;
            const y = (event.clientY / innerHeight - 0.5) * 60;
            if (bgImg) bgImg.style.transform = `scale(1.3) translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
